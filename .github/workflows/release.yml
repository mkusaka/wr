name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun ci
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  release:
    name: Create Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_url: ${{ steps.version.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::Missing required secret: HOMEBREW_TAP_TOKEN"
            exit 1
          fi
      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(bun -p 'JSON.parse(await Bun.file("package.json").text()).version')

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) must match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "wr $GITHUB_REF_NAME" \
            --generate-notes

  package:
    name: Package Binary (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            target: bun-darwin-arm64
            archive_suffix: darwin-arm64
          - label: Intel
            runner: macos-15-intel
            target: bun-darwin-x64
            archive_suffix: darwin-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun ci
      - name: Compile binary
        env:
          TARGET: ${{ matrix.target }}
        run: bun build --compile --minify --sourcemap --target="$TARGET" src/cli.ts --outfile wr
      - name: Package release archive
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          ./wr --help >/dev/null
          mkdir -p release-root/skills
          cp wr release-root/wr
          cp -R skills/operate-wr release-root/skills/

          ASSET_NAME="wr-${VERSION}-${ARCHIVE_SUFFIX}.tar.gz"
          tar -C release-root -czf "$ASSET_NAME" .
          SHA256=$(shasum -a 256 "$ASSET_NAME" | awk '{print $1}')

          {
            echo "ASSET_NAME=$ASSET_NAME"
            echo "SHA256=$SHA256"
          } >> "$GITHUB_ENV"

          cat > "release-metadata-${ARCHIVE_SUFFIX}.json" <<EOF
          {
            "archive_suffix": "${ARCHIVE_SUFFIX}",
            "asset_name": "${ASSET_NAME}",
            "asset_url": "${RELEASE_URL}/${ASSET_NAME}",
            "sha256": "${SHA256}"
          }
          EOF
      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET_NAME" --clobber
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ matrix.archive_suffix }}
          path: release-metadata-${{ matrix.archive_suffix }}.json

  publish:
    name: Publish Release
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  update_homebrew_tap:
    name: Update Homebrew Tap
    needs: [release, package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-metadata-*
          merge-multiple: true
      - name: Render Homebrew formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          DARWIN_ARM64_URL=$(jq -r 'select(.archive_suffix == "darwin-arm64") | .asset_url' release-metadata-*.json)
          DARWIN_ARM64_SHA256=$(jq -r 'select(.archive_suffix == "darwin-arm64") | .sha256' release-metadata-*.json)
          DARWIN_X64_URL=$(jq -r 'select(.archive_suffix == "darwin-x64") | .asset_url' release-metadata-*.json)
          DARWIN_X64_SHA256=$(jq -r 'select(.archive_suffix == "darwin-x64") | .sha256' release-metadata-*.json)
          export DARWIN_ARM64_URL DARWIN_ARM64_SHA256 DARWIN_X64_URL DARWIN_X64_SHA256

          export FORMULA_PATH="$RUNNER_TEMP/wr.rb"
          cp packaging/homebrew/wr.rb "$FORMULA_PATH"

          ruby <<'RUBY'
          path = ENV.fetch("FORMULA_PATH")
          text = File.read(path)
          replacements = {
            "__VERSION__" => ENV.fetch("VERSION"),
            "__DARWIN_ARM64_URL__" => ENV.fetch("DARWIN_ARM64_URL"),
            "__DARWIN_ARM64_SHA256__" => ENV.fetch("DARWIN_ARM64_SHA256"),
            "__DARWIN_X64_URL__" => ENV.fetch("DARWIN_X64_URL"),
            "__DARWIN_X64_SHA256__" => ENV.fetch("DARWIN_X64_SHA256"),
          }

          replacements.each do |placeholder, replacement|
            raise "missing placeholder: #{placeholder}" unless text.include?(placeholder)
            text.gsub!(placeholder, replacement)
          end

          File.write(path, text)
          RUBY

          ruby -c "$FORMULA_PATH"
          FORMULA_CONTENTS_B64=$(base64 < "$FORMULA_PATH" | tr -d '\n')
          echo "FORMULA_CONTENTS_B64=$FORMULA_CONTENTS_B64" >> "$GITHUB_ENV"
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/mkusaka/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[formula]=wr" \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[formula_contents_b64]=$FORMULA_CONTENTS_B64"
